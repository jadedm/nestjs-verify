name: release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      # No dependency cache in a job that publishes: npm's trusted publishing
      # guide advises against it, since a poisoned cache would ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1+; Node 22 bundles npm 10,
      # which answers an OIDC publish with E404 (#19). pnpm publish runs this
      # npm for the upload.
      # Pinned: this job holds id-token: write, so it should not pick up a new
      # npm release unreviewed. Any 11.x from 11.5.1 passes the check below.
      - run: npm install -g npm@11.21.0
      - run: node scripts/check-publish-env.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Never publish a build that a consumer could not load.
      - run: pnpm check:exports
      # Trusted publishing via OIDC: no NPM_TOKEN secret. setup-node's
      # registry-url writes a placeholder NODE_AUTH_TOKEN; npm 11 exchanges the
      # OIDC token first and uses that instead. Each package needs a trusted
      # publisher on npmjs.com (package Settings, Trusted Publisher: GitHub
      # Actions, repository jadedm/nestjs-verify, workflow release.yml).
      # Provenance is automatic.
      #
      # `version` must call Changesets itself: `pnpm version` is passed to
      # `npm version`, which only prints versions, so the Version Packages PR
      # would be empty. `publish` skips the root `release` script's second
      # build, so what ships is the build check:exports just loaded.
      - uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
