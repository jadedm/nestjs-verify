name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first so each package's dist/.d.ts exists. Downstream packages
      # (twilio, gupshup, postgres, mongo, redis) import types from
      # @jadedm/nestjs-verify via its package.json "types" field, which
      # points at dist/index.d.ts.
      - run: pnpm build
      # Load every package's built ESM and CommonJS entry in plain Node, as a
      # consumer would. Unit tests never load dist (#21).
      - run: pnpm check:exports
      - run: pnpm typecheck
      - run: pnpm test
      # No accidental new major: fails if Changesets would carry a package to
      # a new major unless every package asks for it together (#10, #125).
      - run: pnpm check:release-plan

  packed:
    # Install the packed packages into a clean project outside the workspace,
    # once with each peer's oldest supported major and once with the newest,
    # and load and type-check them there (#23). Built once on Node 22, checked
    # on each supported Node line (22 and later, #123).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 22, profile: lowest }
          - { node: 22, profile: highest }
          - { node: 24, profile: lowest }
          - { node: 24, profile: highest }
          - { node: 26, profile: lowest }
          - { node: 26, profile: highest }
          # Adapters beside the lowest published core their peer range
          # admits, from npm, rather than the workspace's core (#76).
          - { node: 22, profile: lowest, core: floor }
          - { node: 26, profile: highest, core: floor }
    name: packed (node ${{ matrix.node }}, ${{ matrix.profile }}${{ matrix.core == 'floor' && ', core floor' || '' }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-packed.mjs --profile ${{ matrix.profile }} ${{ matrix.core == 'floor' && '--core floor' || '' }}

  adapters:
    runs-on: ubuntu-latest
    # Run the live adapter contract suite. Spins up Postgres + Mongo + Redis
    # in Docker and exercises every store interface against each. Catches
    # adapter regressions that unit tests miss.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:adapters
      # The workspace installs mongodb 6 only; run the Mongo stores under
      # every driver major their peer range accepts (#79).
      - run: pnpm test:adapters:mongo-drivers
