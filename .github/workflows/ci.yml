name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first so each package's dist/.d.ts exists. Downstream packages
      # (twilio, gupshup, postgres, mongo, redis) import types from
      # @jadedm/nestjs-verify via its package.json "types" field, which
      # points at dist/index.d.ts.
      - run: pnpm build
      # Load every package's built ESM and CommonJS entry in plain Node, as a
      # consumer would. Unit tests never load dist (#21).
      - run: pnpm check:exports
      - run: pnpm typecheck
      - run: pnpm test

  packed:
    # Install the packed packages into a clean project outside the workspace,
    # once with each peer's oldest supported major and once with the newest,
    # and load and type-check them there (#23). Built once on Node 22, checked
    # on each Node a consumer may run. Nest 11 and the SES SDK need Node 20,
    # so Node 18 runs only the oldest majors.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 18, profile: lowest }
          - { node: 20, profile: lowest }
          - { node: 20, profile: highest }
          - { node: 22, profile: lowest }
          - { node: 22, profile: highest }
    name: packed (node ${{ matrix.node }}, ${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-packed.mjs --profile ${{ matrix.profile }}

  adapters:
    runs-on: ubuntu-latest
    # Run the live adapter contract suite. Spins up Postgres + Mongo + Redis
    # in Docker and exercises every store interface against each. Catches
    # adapter regressions that unit tests miss.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:adapters
